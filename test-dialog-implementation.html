<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialog Implementation Test</title>
    <style>
        /* Test styles for dialog element */
        dialog {
            border: none;
            border-radius: 10px;
            padding: 40px;
            max-width: 520px;
            background: #fff;
        }
        
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.3);
        }
        
        .close {
            position: absolute;
            top: 5px;
            right: 10px;
            color: #525252;
            text-decoration: none;
            cursor: pointer;
            font-size: 28px;
            padding: 5px;
            min-width: 30px;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
        }
        
        .close:hover {
            color: #000000;
            background-color: #f0f0f0;
        }
        
        .gf-popup-button {
            background: #0073aa;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .gf-popup-button:hover {
            background: #005a87;
        }
    </style>
</head>
<body>
    <h1>Dialog Implementation Test</h1>
    
    <button onclick="testNativeDialog()">Test Native Dialog</button>
    <button onclick="testLegacyDialog()">Test Legacy Dialog</button>
    
    <div id="browser-info"></div>
    
    <script>
        // Browser support detection
        function supportsDialog() {
            return typeof HTMLDialogElement !== 'undefined' && 
                   typeof HTMLDialogElement.prototype.showModal === 'function';
        }
        
        // Display browser information
        function showBrowserInfo() {
            const info = document.getElementById('browser-info');
            info.innerHTML = `
                <h3>Browser Information:</h3>
                <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
                <p><strong>Dialog Support:</strong> ${supportsDialog() ? 'Yes' : 'No'}</p>
                <p><strong>HTMLDialogElement:</strong> ${typeof HTMLDialogElement !== 'undefined' ? 'Available' : 'Not Available'}</p>
                <p><strong>showModal Method:</strong> ${typeof HTMLDialogElement !== 'undefined' && typeof HTMLDialogElement.prototype.showModal === 'function' ? 'Available' : 'Not Available'}</p>
            `;
        }
        
        // Test native dialog implementation
        function testNativeDialog() {
            if (!supportsDialog()) {
                alert('Native dialog not supported in this browser. Use legacy test instead.');
                return;
            }
            
            const dialog = document.createElement('dialog');
            dialog.innerHTML = `
                <a class="close" aria-label="Close confirmation">&times;</a>
                <div class="message" id="gf-popup-title">
                    <h2>Native Dialog Test</h2>
                    <p>This is a test of the native HTML dialog element implementation.</p>
                    <p>This should have automatic focus management and ESC key handling.</p>
                </div>
                <button class="gf-popup-button">OK</button>
            `;
            
            document.body.appendChild(dialog);
            
            // Add event listeners
            dialog.querySelector('.gf-popup-button').addEventListener('click', () => {
                dialog.close();
                dialog.remove();
            });
            
            dialog.querySelector('.close').addEventListener('click', () => {
                dialog.close();
                dialog.remove();
            });
            
            // Show the dialog
            dialog.showModal();
        }
        
        // Test legacy dialog implementation
        function testLegacyDialog() {
            const overlay = document.createElement('div');
            overlay.id = 'gfcnf-overlay';
            overlay.style.cssText = `
                display: flex;
                justify-content: center;
                align-items: center;
                background: rgba(0, 0, 0, 0.3);
                height: 100%;
                position: fixed;
                top: 0; left: 0;
                width: 100%;
                z-index: 999;
            `;
            
            const modal = document.createElement('div');
            modal.id = 'gf-popup-confirmation';
            modal.style.cssText = `
                position: relative;
                background: #fff;
                border-radius: 10px;
                display: block;
                margin: auto;
                max-width: 520px;
                padding: 40px;
                z-index: 1000;
            `;
            modal.setAttribute('aria-modal', 'true');
            modal.setAttribute('role', 'dialog');
            modal.setAttribute('aria-labelledby', 'gf-popup-title');
            
            modal.innerHTML = `
                <a class="close" aria-label="Close confirmation">&times;</a>
                <div class="message" id="gf-popup-title">
                    <h2>Legacy Dialog Test</h2>
                    <p>This is a test of the legacy div-based modal implementation.</p>
                    <p>This should work in all browsers but requires custom focus management.</p>
                </div>
                <button class="gf-popup-button">OK</button>
            `;
            
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            
            // Add event listeners
            modal.querySelector('.gf-popup-button').addEventListener('click', () => {
                overlay.remove();
            });
            
            modal.querySelector('.close').addEventListener('click', () => {
                overlay.remove();
            });
            
            // Close on overlay click
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.remove();
                }
            });
            
            // Close on ESC key
            document.addEventListener('keydown', function escHandler(e) {
                if (e.keyCode === 27) {
                    overlay.remove();
                    document.removeEventListener('keydown', escHandler);
                }
            });
        }
        
        // Show browser info on page load
        showBrowserInfo();
    </script>
</body>
</html>
